# =============================================================================
# Stage 10 -- baseline arm, p_recur=0.0 (open population)
# =============================================================================
# Generated by sumo_open_loop/make_stage7_configs.py. Do not edit by hand;
# edit the generator so all 8 configs of this stage move together.
#
# Open-population trace, M=20 slots, C=4, 4000 rounds, seed 4127.
# Stage 0 filter is ABSENT by construction (see the generator's docstring).
#
# Run:
#   cd examples/async/fedasync
#   PYTHONPATH=gpu_tiers:gpu_tiers_dataset:.:sumo_close_loop:sumo_open_loop \
#       python3 sumo_open_loop/sumo_open_fedasync.py -c sumo_open_loop/configs/stage10f1_s4127/baseline_open.toml
# =============================================================================

[general]
base_path = "./runs/sumo_open_loop/stage10f1_s4127_baseline_open"

[clients]
type = "simple"
total_clients = 20
per_round = 4
do_test = false

speed_simulation = true
comm_simulation = true
sleep_simulation = true
avg_training_time = 0.0
max_sleep_time = 300
random_seed = 4127

[server]
address = "127.0.0.1"
port = 18920
synchronous = false
simulate_wall_time = true
periodic_interval = 1
ping_interval = 30
ping_timeout = 3600

staleness_bound = 25
minimum_clients_aggregated = 1
mixing_hyperparameter = 0.5
adaptive_mixing = true
eval_interval = 10
random_seed = 4127

[server.staleness_weighting_function]
type = "polynomial"
a = 0.5

# p_recur is the identity policy: 0 wipes a slot's server-side state on every
# recycle (open population), 1 retains it (closed control on the same trace).
[sumo_open]
coverage_csv = "/workspace/plato/examples/async/fedasync/sumo_open_loop/sumo_trace/e1_open_poisson_seed4126_range400/coverage_windows.csv"
p_recur = 0.0
slots = 20
# Stage 10: the open-population Stage 0 gate (open_stage0.py).
stage0_t_hat = "tier_spec"
stage0_r_i = "vmax_distance"
coverage_radius_m = 400.0
v_max_mps = 19.444444
rsu_x_m = 600.0
positions_csv = "/workspace/plato/examples/async/fedasync/sumo_open_loop/sumo_trace/e1_open_poisson_seed4126_range400/trace.csv"
# Stage 10: the RUN seed above varies; the PHYSICS seed (vehicle
# sleeps, allocator) is pinned to Stage 7b's.
physics_seed = 4126

[data]
datasource = "Torchvision"
dataset_name = "CIFAR10"
download = true
data_path = "/workspace/plato/examples/async/fedasync/data"
partition_size = 2500
sampler = "noniid"
concentration = 0.8
random_seed = 4127

[trainer]
type = "basic"
rounds = 4000
max_concurrency = 4
target_accuracy = 0.9
model_name = "resnet_18"
epochs = 1
batch_size = 64
optimizer = "SGD"

[algorithm]
type = "fedavg"

[parameters]

[parameters.optimizer]
lr = 0.01
momentum = 0.9
weight_decay = 0.0005

[results]
types = "round, elapsed_time, accuracy, train_loss, valid_loss"
record_clients_accuracy = false

[gpu_tier]
tiers_csv   = "/workspace/plato/examples/async/fedasync/gpu_tiers_dataset/tiers/tiers_estimated_15x.csv"
clients_csv = "/workspace/plato/examples/async/fedasync/sumo_close_loop/input/clients_n20r400.csv"
anchor_tier  = "xavier"
anchor_sleep = 15
t_round_model = "queue"
