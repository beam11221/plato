# =============================================================================
# BLUEPRINT — GPU arm (staleness_predictor = "gpu_tops")
# =============================================================================
# One config per heterogeneity gap G.  The server's staleness predictor reads
# the SAME tier file that produced the clients' sleep times, so belief == reality:
#
#     reality (clients sleep)  ->  output/client_sleep_times_xa20_gap30_m50_35_15.csv
#     belief  (predictor)      ->  input/tiers_geo_gap30.csv
#
# This is the control arm.  Its sibling, fedasync_polaris_vi_cpu_arm.toml.tmpl,
# keeps `reality` byte-identical and swaps only `belief` to tiers_cpu.csv, so any
# difference between the two runs at the same G is attributable to predictor
# mismatch alone — not to different training times.
#
# -----------------------------------------------------------------------------
# Placeholders (substituted by the config generator)
# -----------------------------------------------------------------------------
#   30     two-digit gap, zero-padded: 01 05 10 15 20 25 30 35 40
#   20  anchor sleep in seconds for the straggler tier (xavier), e.g. 20
#   15130    unique TCP port for this run (see port plan below)
#
# Port plan — every run in the sweep must get its own port, and GPU/CPU arms of
# the same G run as two separate processes:
#   GPU arm: 8100 + G   (G=01 -> 8101, 05 -> 8105, ... 40 -> 8140)
#   CPU arm: 8200 + G   (G=01 -> 8201, 05 -> 8205, ... 40 -> 8240)
#
# -----------------------------------------------------------------------------
# Prerequisites
# -----------------------------------------------------------------------------
#   cd gpu_tiers && ./make_gap_sweep.sh 500 1 20
# regenerates input/tiers_geo_gapNN.csv and output/client_sleep_times_xaNN_gapNN.csv.
# partition_size and epochs below MUST match the arguments given there, or the
# clients' sleeps and the predictor's belief will describe different workloads.
#
# -----------------------------------------------------------------------------
# Run
# -----------------------------------------------------------------------------
#   cd /workspace/plato/examples/async/fedasync
#   PYTHONPATH=gpu_tiers uv run fedasync_gpu_tier_polaris_vi.py \
#       -c gpu_tiers/configs/gpu_xa20_gap30.toml
#
# PYTHONPATH is required: gpu_tier_sleep.py lives in gpu_tiers/, but
# fedasync_gpu_tier_polaris_vi.py and fedasync_polaris_vi_server.py both do a
# bare `import gpu_tier_sleep`.
# =============================================================================

[general]
base_path = "./runs/comm_sweep/gpu_xa20_gap30_m50_35_15_b050"

[clients]
type = "simple"
total_clients = 100
per_round = 10
do_test = false

# speed_simulation = true : each client reads its own tier sleep from the CSV below.
# sleep_simulation = true : that time is REPORTED to the server but never actually
#   slept — plato/trainers/composable.py:392 returns early instead of calling
#   time.sleep(), and plato/clients/strategies/defaults.py:357 substitutes
#   training_time = (avg_training_time + sleep) * epochs.  The server's simulated
#   clock still sees the full 20 / 4.47 / 1.0 s spread; the run just stops paying
#   for it in real time.  Measured on a 10-round A/B run: 3.74x less real wall
#   clock, simulated clock within 8%, identical staleness predictions
#   (gpu_tiers/smoke_test_sleep_simulation.py).
speed_simulation = true
comm_simulation = false
sleep_simulation = true

# REQUIRED whenever sleep_simulation = true: defaults.py:356 reads it with no
# guard, so omitting it is an AttributeError on the first client report.
# It stands in for the real ResNet-18 compute that is no longer being measured —
# 1.5 s on the machine this was calibrated on, which keeps the simulated clock
# (and the effective-gap table in README_gpu_tier.md, built on c ~ 2.0 s) matching
# the earlier real-sleep runs.  Set 0.0 to make the tier sleep the sole
# determinant of training time.  Re-measure with the smoke test if the model,
# partition_size, or GPU changes.
avg_training_time = 1.5

# Config.simulate_client_speed() silently clips every sleep at max_sleep_time
# (default 60 s, plato/config.py).  Keep this comfortably above 20.
max_sleep_time = 120

# REALITY — what the clients actually do.  Identical file in the CPU arm.
[clients.simulation_distribution]
distribution = "custom"
csv_path = "/workspace/plato/examples/async/fedasync/gpu_tiers/output/client_sleep_times_xa20_gap30_m50_35_15_b050.csv"

[server]
address = "127.0.0.1"
port = 15130
synchronous = false
simulate_wall_time = true
periodic_interval = 1
ping_interval = 30
ping_timeout = 3600

# FedAsync parameters
# Raised from 11 to 25 on 2026-08-10, after the base.py flush-accounting fix
# (HANDOFF § 4.9) restored the client pipeline to its configured depth.
#
# 11 was calibrated against a drained pipeline: with only 1-3 clients in flight,
# nothing was ever stale and the bound fired 3 times in 2710 rounds.  With the
# pipeline back at 9-10, a client's staleness in rounds is roughly
#
#     staleness_i  ~  (C / M) * (T_i / T_mean_selected)
#
# for C clients in flight and M merges per round, so the bound started firing on
# 13 % of rounds and censored the slowest tier: measured on gpu G=40, 67 % of
# xavier dispatches exceeded 11 while orin and thor never did.
#
# That is not neutral between the arms, which is why it had to change.  The
# divisor is the mean duration of the clients an arm actually selects, so an arm
# that steers harder toward fast clients lowers it and inflates the staleness of
# every straggler it still picks — penalising exactly the behaviour the sweep
# exists to measure.  At G=40: gpu predicts ~12.9 rounds for a xavier client and
# cpu ~9.2, for the identical client.
#
# 25 comes from the worst case rather than taste.  Once the bound stops firing,
# flushes stop lifting M, so C/M rises from 6.2 toward 9, and the widest gap has
# T_xavier / T_mean ~ 2.4 -> ~21 rounds.  25 clears that with headroom while
# staying a real bound.  Re-derive it if max_concurrency, the tier spread or
# minimum_clients_aggregated change.
staleness_bound = 25
minimum_clients_aggregated = 1
mixing_hyperparameter = 0.5
adaptive_mixing = true
eval_interval = 10

# BELIEF — how the server estimates training latency for V_i = G_i / sqrt(1 + τ̂_i).
# "gpu_tops": τ̂_i = gpu_tops_predict_seconds(cid, partition_size, epochs) / T_round,
#             computed from [gpu_tier] tiers_csv below.
staleness_predictor = "gpu_tops"

# Polaris aggregation hyper-parameters.
# KEEP THESE ABOVE the [server.staleness_weighting_function] header.  In TOML,
# any bare key after a sub-table header belongs to that sub-table — the original
# configs_backup/ configs put these three below it, so they landed in
# server.staleness_weighting_function and fedasync_polaris_vi_server.py's
# getattr(server_cfg, "polaris_alpha", 10.0) silently fell back to its defaults.
# The defaults happened to equal these values, so the bug was invisible until you
# tried to change one.
polaris_alpha = 10.0
polaris_initial_gradient_bound = 0.5
polaris_initial_staleness = 0.01

[server.staleness_weighting_function]
type = "polynomial"
a = 0.5

[data]
datasource = "Torchvision"
dataset_name = "CIFAR10"
download = true
# data_path is always joined onto base_path (plato/config.py:360-367), so without
# an ABSOLUTE path here every run in the sweep re-downloads CIFAR-10 into its own
# directory — 170 MB x 27 runs.  Point all of them at the copy already unpacked
# in the example directory.
data_path = "/workspace/plato/examples/async/fedasync/data"

# Must equal --dataset-size passed to make_gap_sweep.sh.
partition_size = 500

sampler = "noniid"
concentration = 0.9
random_seed = 8888

[trainer]
type = "basic"
rounds = 5000
max_concurrency = 10
# 0.6, lowered from 0.7 on 2026-08-09.  Measured on the two finished gap01 runs,
# accuracy saturates near 0.60 by round ~4000-6000 and is flat for the remaining
# 6000 (gpu 0.5943 best @r8150, cpu 0.6032 best @r5760), so 0.7 was unreachable
# and every run burned the full 10000 rounds — ~6 h instead of ~2-3 h.
# Shared key: must stay identical in all three templates (make_configs.py
# enforces it).  Note gap01 may not reach 0.6 at all and will still run to
# `rounds`; that point is censored, not broken.
# RENDERED (make_configs.py --target-accuracy), default 0.6 so the gap sweep's
# configs stay byte-identical.  It acts as an EARLY STOP, read off a single raw
# evaluation, so a run trips it on a noise spike and stops at a random moment
# rather than a comparable one: cpu_xa20_gap20 crossed 0.60 at round 3770 while
# its own trend was declining, and its gpu twin paid the full 10 000 rounds — a
# 2.7x difference in run length caused by neither selector (HANDOFF § 4.13).
# The mix sweep therefore renders it at 1.01, above any reachable accuracy, so
# every cell runs exactly `rounds` rounds and the curves stay comparable;
# time-to-55 % is then read off the smoothed curve afterwards.
target_accuracy = 1.01
model_name = "resnet_18"
# Must equal --epochs passed to make_gap_sweep.sh.
epochs = 1
batch_size = 64
optimizer = "SGD"

[algorithm]
type = "fedavg"

[parameters]

[parameters.optimizer]
lr = 0.01
momentum = 0.9
weight_decay = 0.0005

[results]
types = "round, elapsed_time, accuracy, train_loss, valid_loss"
record_clients_accuracy = false

# -----------------------------------------------------------------------------
# GPU-tier configuration — read by gpu_tier_sleep.get_computer(), which is what
# the staleness predictor calls.  This is the ONLY line that differs between the
# GPU and CPU arms.
#
# GPU arm: tiers_geo_gap30.csv — the same tier file that generated the sleep
# CSV above, so the predictor's spread matches reality exactly (mismatch = 1.0).
# -----------------------------------------------------------------------------
[gpu_tier]
tiers_csv   = "/workspace/plato/examples/async/fedasync/gpu_tiers/input/tiers_geo_gap30.csv"
# The client -> tier map, i.e. the fleet's COMPOSITION.  The mix suffix below is
# empty for the historical 50/35/15 fleet and "_m<xavier>_<orin>_<thor>" for a
# mix-sweep cell (make_mixes.py).  It must move together with the sleep CSV above: those
# two files are one fleet seen from its two sides — who is in which tier, and how
# long each client therefore sleeps.  A config that mixes a 70/20/10 clients file
# with the 50/35/15 sleep file is not an error anything would catch; the clients
# would simply sleep by one fleet while the predictor believed another.
clients_csv = "/workspace/plato/examples/async/fedasync/gpu_tiers/input/clients_m50_35_15.csv"

# Put the predictor on the simulator's wall-clock scale.  MUST match the
# --anchor-tier / --anchor-sleep passed to generate_sleep_times.py for the sleep
# CSV above, or select_clients() compares a predicted duration against elapsed
# wall time in different units and the residual-aware Phase 1 of
# gpu_tops_predict_staleness_rounds stops firing.  Raw formula = 0.055 s for
# xavier vs 20 s of reality, a 363x gap.
anchor_tier  = "xavier"
anchor_sleep = 20

# Which model converts a training time into a staleness in rounds:
#     tau_hat_i = T_i / T_round
#
#   "min"   E[min of P i.i.d. draws] — the historical behaviour, and WRONG.
#           It is the time to the first completion when all P clients start at
#           the same instant, i.e. a cold start.  In steady state the in-flight
#           jobs have staggered start times, so the next merge arrives far sooner.
#   "queue" E[T] / C — a closed queue of C slots, each refilled with a freshly
#           drawn client, so each slot completes one job per E[T] and the C slots
#           merge at C/E[T].  This is the correct one.
#
# Measured against d(elapsed_time)/d(round) in the four finished gpu runs:
#
#     G    measured      "min"      "queue"
#     1     2.183 s    +816.1 %      +1.8 %
#    10     1.336 s    +114.5 %      -3.3 %
#    20     1.205 s     +40.9 %      -5.0 %
#    30     1.147 s     +10.8 %      -7.4 %
#
# The error of "min" is not a constant that cancels in tau_hat — it decays with
# the gap, which is the sweep's own independent variable.  Since
# V_i = G_i / sqrt(1 + tau_hat_i), it weakens the speed term hardest at the
# narrow-gap end, i.e. it damps the very mechanism the sweep measures, by an
# amount that varies along the x-axis.  (HANDOFF § 4.11.)
#
# Left at "min" ON PURPOSE: the sweep in flight since 2026-08-10 started under it,
# and switching mid-sweep would make the arms incomparable.  Flipping to "queue"
# means discarding every run and restarting all 15.  Shared key — make_configs.py
# checks it matches across the three arms (SHARED_GPU_TIER_KEYS).
#
# RENDERED, not fixed: make_configs.py --t-round-model writes it, defaulting to
# "min" so the gap sweep's configs stay byte-identical.  The mix sweep is
# generated with "queue" — the "min" error depends on the pool's composition, so
# on THAT sweep's x-axis it varies from ~0 % at 50/35/15 to +194 % at 85/10/5,
# which is the § 4.11 confound again on a different axis (HANDOFF § 4.14).
t_round_model = "queue"

# Communication latency C = D/B, added on top of compute time
# (BRIEF_comm_sweep.md).  Uplink only — downlink is a base-station
# broadcast at far higher transmit power and is conventionally
# neglected in this literature.  Absent this table entirely -> C = 0,
# byte-identical to every run made before this feature existed.
comm_bandwidth_mbps = 50
payload_mbit = 341.52
comm_in_predictor = true
