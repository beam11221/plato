# N=20, C=4, 4000 rounds, radius-400 trace, upload_policy=coverage_gated.
# RUN seed = 4128 ([clients]/[server]/[data] random_seed, all equal) -- the
# FLEET seed embedded in the fleet name (n20_..._s4126) never changes; the
# sleep CSV path below is identical across every Stage 6 config regardless of
# this run's seed. See prompts/STAGE6_seeds.md, "The one thing that must not
# vary".
#
# Runs through sumo_fedasync_seeded.py (NOT sumo_fedasync.py): torch, numpy
# and python random are all seeded from THIS seed, plus a per-(client,round)
# re-seed in training -- see that file's module docstring.
#
# Run:
#   cd examples/async/fedasync
#   PYTHONPATH=gpu_tiers:gpu_tiers_dataset:.:sumo_close_loop \
#       python3 sumo_close_loop/sumo_fedasync_seeded.py -c sumo_close_loop/configs/stage6/baseline_tier_spec_vmax_distance_s4128.toml
# =============================================================================

[general]
base_path = "./runs/sumo_close_loop/stage6_baseline_tier_spec_vmax_distance_s4128"

[clients]
type = "simple"
total_clients = 20
per_round = 4
do_test = false

speed_simulation = true
comm_simulation = true
sleep_simulation = true
avg_training_time = 0.0
max_sleep_time = 300
random_seed = 4128

[clients.simulation_distribution]
distribution = "custom"
csv_path = "/workspace/plato/examples/async/fedasync/sumo_close_loop/output/client_sleep_times_n20r400.csv"

[server]
address = "127.0.0.1"
port = 18623
synchronous = false
simulate_wall_time = true
periodic_interval = 1
ping_interval = 30
ping_timeout = 3600

staleness_bound = 25
minimum_clients_aggregated = 1
mixing_hyperparameter = 0.5
adaptive_mixing = true
eval_interval = 10
random_seed = 4128

[server.staleness_weighting_function]
type = "polynomial"
a = 0.5

# stage0_t_hat = "none" disables Stage 0 entirely -- coverage_radius_m /
# v_max_mps / stage0_r_i / positions_csv / rsu_x_m are then never read.
[sumo]
coverage_csv = "/workspace/plato/examples/async/fedasync/sumo_close_loop/input/coverage_n20r400.csv"
upload_policy = "coverage_gated"
stage0_t_hat = "tier_spec"
coverage_radius_m = 400.0
v_max_mps = 19.444444
stage0_r_i = "vmax_distance"
positions_csv = "/workspace/plato/examples/async/fedasync/sumo_close_loop/input/positions_n20r400.csv"
rsu_x_m = 600.0

[data]
datasource = "Torchvision"
dataset_name = "CIFAR10"
download = true
data_path = "/workspace/plato/examples/async/fedasync/data"
partition_size = 2500
sampler = "noniid"
concentration = 0.8
random_seed = 4128

[trainer]
type = "basic"
rounds = 4000
max_concurrency = 4
target_accuracy = 0.9
model_name = "resnet_18"
epochs = 1
batch_size = 64
optimizer = "SGD"

[algorithm]
type = "fedavg"

[parameters]

[parameters.optimizer]
lr = 0.01
momentum = 0.9
weight_decay = 0.0005

[results]
types = "round, elapsed_time, accuracy, train_loss, valid_loss"
record_clients_accuracy = false

[gpu_tier]
tiers_csv   = "/workspace/plato/examples/async/fedasync/gpu_tiers_dataset/tiers/tiers_estimated_15x.csv"
clients_csv = "/workspace/plato/examples/async/fedasync/sumo_close_loop/input/clients_n20r400.csv"
anchor_tier  = "xavier"
anchor_sleep = 15
t_round_model = "queue"
