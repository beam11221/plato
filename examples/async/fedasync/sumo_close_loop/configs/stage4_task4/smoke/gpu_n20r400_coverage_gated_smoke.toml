# =============================================================================
# Stage 4 Task 4 -- gpu arm, upload_policy=coverage_gated, n20r400 fleet
# =============================================================================
# Generated by sumo_close_loop/make_stage4_task4_configs.py. Do not edit by
# hand; edit the generator so all 8 configs of this cell move together.
#
# N=20, C=4, seed 4126, 4000 rounds, radius-400 trace. sleep_csv is a
# byte-identical copy of the Stage 3 N=20 fleet's sleep_times.csv (Step B).
#
# Run:
#   cd examples/async/fedasync
#   PYTHONPATH=gpu_tiers:.:sumo_close_loop \
#       python3 sumo_close_loop/sumo_fedasync.py -c sumo_close_loop/configs/stage4_task4/gpu_n20r400_coverage_gated.toml
# =============================================================================

[general]
base_path = "./runs/sumo_close_loop/smoke_gpu_n20r400_coverage_gated"

[clients]
type = "simple"
total_clients = 20
per_round = 4
do_test = false

speed_simulation = true
comm_simulation = true
sleep_simulation = true
avg_training_time = 0.0
max_sleep_time = 300

[clients.simulation_distribution]
distribution = "custom"
csv_path = "/workspace/plato/examples/async/fedasync/sumo_close_loop/output/client_sleep_times_n20r400.csv"

[server]
address = "127.0.0.1"
port = 18620
synchronous = false
simulate_wall_time = true
periodic_interval = 1
ping_interval = 30
ping_timeout = 3600

staleness_bound = 25
minimum_clients_aggregated = 1
mixing_hyperparameter = 0.5
adaptive_mixing = true
eval_interval = 10
staleness_predictor = "gpu_tops"
polaris_alpha = 10.0
polaris_initial_gradient_bound = 0.5
polaris_initial_staleness = 0.01

[server.staleness_weighting_function]
type = "polynomial"
a = 0.5

# RSU coverage windows, keyed by client_id, on the radius-400 trace. Written
# by remap_fleet.py; upload_policy is Stage 4 Task 4's addition to
# sumo_server.py (resolve_upload_policy), absent = "coverage_gated".
[sumo]
coverage_csv = "/workspace/plato/examples/async/fedasync/sumo_close_loop/input/coverage_n20r400.csv"
upload_policy = "coverage_gated"

[data]
datasource = "Torchvision"
dataset_name = "CIFAR10"
download = true
data_path = "/workspace/plato/examples/async/fedasync/data"
partition_size = 2500
sampler = "noniid"
concentration = 0.8
random_seed = 4126

[trainer]
type = "basic"
rounds = 20
max_concurrency = 4
target_accuracy = 0.9
model_name = "resnet_18"
epochs = 1
batch_size = 64
optimizer = "SGD"

[algorithm]
type = "fedavg"

[parameters]

[parameters.optimizer]
lr = 0.01
momentum = 0.9
weight_decay = 0.0005

[results]
types = "round, elapsed_time, accuracy, train_loss, valid_loss"
record_clients_accuracy = false

[gpu_tier]
tiers_csv   = "/workspace/plato/examples/async/fedasync/gpu_tiers_dataset/tiers/tiers_estimated_15x.csv"
clients_csv = "/workspace/plato/examples/async/fedasync/sumo_close_loop/input/clients_n20r400.csv"
anchor_tier  = "xavier"
anchor_sleep = 15
t_round_model = "queue"
