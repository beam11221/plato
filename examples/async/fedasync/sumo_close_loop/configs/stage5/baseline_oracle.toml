# =============================================================================
# Stage 5 -- baseline_oracle: selector=baseline, stage0_t_hat=oracle, n20r400 fleet
# =============================================================================
# Generated by sumo_close_loop/make_stage5_configs.py. Do not edit by hand;
# edit the generator so all 6 configs of this stage move together.
#
# N=20, C=4, seed 4126, 4000 rounds, radius-400 trace, upload_policy=coverage_gated.
# Identical to its Task 4 `stage0_t_hat=none` control in every section except
# [sumo] (stage0_t_hat / coverage_radius_m / v_max_mps) and, for the oracle
# run, [gpu_tier] oracle_sleep_csv -- see prompts/STAGE5_stage0_filter.md.
#
# Run:
#   cd examples/async/fedasync
#   PYTHONPATH=gpu_tiers:.:sumo_close_loop \
#       python3 sumo_close_loop/sumo_fedasync.py -c sumo_close_loop/configs/stage5/baseline_oracle.toml
# =============================================================================

[general]
base_path = "./runs/sumo_close_loop/stage5_baseline_oracle"

[clients]
type = "simple"
total_clients = 20
per_round = 4
do_test = false

speed_simulation = true
comm_simulation = true
sleep_simulation = true
avg_training_time = 0.0
max_sleep_time = 300

[clients.simulation_distribution]
distribution = "custom"
csv_path = "/workspace/plato/examples/async/fedasync/sumo_close_loop/output/client_sleep_times_n20r400.csv"

[server]
address = "127.0.0.1"
port = 18602
synchronous = false
simulate_wall_time = true
periodic_interval = 1
ping_interval = 30
ping_timeout = 3600

staleness_bound = 25
minimum_clients_aggregated = 1
mixing_hyperparameter = 0.5
adaptive_mixing = true
eval_interval = 10

[server.staleness_weighting_function]
type = "polynomial"
a = 0.5

# RSU coverage windows, keyed by client_id, on the radius-400 trace. Written
# by remap_fleet.py. stage0_t_hat / coverage_radius_m / v_max_mps are Stage
# 5's addition (stage0_filter.py); coverage_radius_m and v_max_mps are the
# trace's own config.yaml constants.
[sumo]
coverage_csv = "/workspace/plato/examples/async/fedasync/sumo_close_loop/input/coverage_n20r400.csv"
upload_policy = "coverage_gated"
stage0_t_hat = "oracle"
coverage_radius_m = 400.0
v_max_mps = 19.444444

[data]
datasource = "Torchvision"
dataset_name = "CIFAR10"
download = true
data_path = "/workspace/plato/examples/async/fedasync/data"
partition_size = 2500
sampler = "noniid"
concentration = 0.8
random_seed = 4126

[trainer]
type = "basic"
rounds = 4000
max_concurrency = 4
target_accuracy = 0.9
model_name = "resnet_18"
epochs = 1
batch_size = 64
optimizer = "SGD"

[algorithm]
type = "fedavg"

[parameters]

[parameters.optimizer]
lr = 0.01
momentum = 0.9
weight_decay = 0.0005

[results]
types = "round, elapsed_time, accuracy, train_loss, valid_loss"
record_clients_accuracy = false

[gpu_tier]
tiers_csv   = "/workspace/plato/examples/async/fedasync/gpu_tiers_dataset/tiers/tiers_estimated_15x.csv"
clients_csv = "/workspace/plato/examples/async/fedasync/sumo_close_loop/input/clients_n20r400.csv"
anchor_tier  = "xavier"
anchor_sleep = 15
t_round_model = "queue"
oracle_sleep_csv = "/workspace/plato/examples/async/fedasync/gpu_tiers_dataset/fleets/n20_x10-o7-t3_xa15_p2500_j0p149_s4126/sleep_times.csv"
