# =============================================================================
# SUMO closed-loop FedAsync -- gpu arm, n20 fleet
# =============================================================================
# Generated by sumo_close_loop/make_sumo_configs.py. Do not edit by hand; edit the
# generator so all four arms move together.
#
# Run:
#   cd examples/async/fedasync
#   PYTHONPATH=gpu_tiers:.:sumo_close_loop \
#       uv run sumo_close_loop/sumo_fedasync.py -c sumo_close_loop/configs/gpu_n20.toml
# =============================================================================

[general]
base_path = "./runs/sumo_close_loop/gpu_n20"

[clients]
type = "simple"
total_clients = 20
per_round = 4
do_test = false

speed_simulation = true
# true means "charge nothing for communication" -- it routes the payload through
# a file and sets comm_time = 0. sumo_server.configure() requires it, because
# the upload decision recomputes the finish time from the report and needs
# comm_time to be a known zero.
comm_simulation = true
sleep_simulation = true
# 0.0 so belief and reality coincide: the tier sleep is the whole training time.
# The key must be present -- clients/strategies/defaults.py reads it unguarded.
avg_training_time = 0.0
# Config.simulate_client_speed() clips at this value silently. xavier sleeps 15 s
# here, so the default 60 would be safe, but keeping headroom costs nothing.
max_sleep_time = 300

# REALITY -- what the clients actually sleep. Identical in all four arms; only
# the cpu arm's BELIEF differs, via [gpu_tier] tiers_csv below.
[clients.simulation_distribution]
distribution = "custom"
csv_path = "/workspace/plato/examples/async/fedasync/sumo_close_loop/output/client_sleep_times_n20.csv"

[server]
address = "127.0.0.1"
port = 18200
synchronous = false
simulate_wall_time = true
periodic_interval = 1
ping_interval = 30
ping_timeout = 3600

# Inert here: with C = 4, M = 1 and E[T] = 8.32 s, xavier lands at ~7.2 rounds.
staleness_bound = 25
minimum_clients_aggregated = 1
mixing_hyperparameter = 0.5
adaptive_mixing = true
eval_interval = 10
staleness_predictor = "gpu_tops"
polaris_alpha = 10.0
polaris_initial_gradient_bound = 0.5
polaris_initial_staleness = 0.01

[server.staleness_weighting_function]
type = "polynomial"
a = 0.5

# RSU coverage windows, keyed by client_id. Written by remap_fleet.py from the
# SUMO trace; it must match the fleet in [gpu_tier] clients_csv.
[sumo]
coverage_csv = "/workspace/plato/examples/async/fedasync/sumo_close_loop/input/coverage_n20.csv"

[data]
datasource = "Torchvision"
dataset_name = "CIFAR10"
download = true
# Absolute, because data_path is joined onto base_path (plato/config.py:360).
data_path = "/workspace/plato/examples/async/fedasync/data"
partition_size = 2500
sampler = "noniid"
concentration = 1.0
random_seed = 4126

[trainer]
type = "basic"
rounds = 10000
max_concurrency = 4
target_accuracy = 0.9
model_name = "resnet_18"
epochs = 1
batch_size = 64
optimizer = "SGD"

[algorithm]
type = "fedavg"

[parameters]

[parameters.optimizer]
lr = 0.01
momentum = 0.9
weight_decay = 0.0005

[results]
types = "round, elapsed_time, accuracy, train_loss, valid_loss"
record_clients_accuracy = false

[gpu_tier]
tiers_csv   = "/workspace/plato/examples/async/fedasync/surgical/input/tiers_estimated_15x.csv"
clients_csv = "/workspace/plato/examples/async/fedasync/sumo_close_loop/input/clients_n20.csv"
anchor_tier  = "xavier"
anchor_sleep = 15
t_round_model = "queue"
