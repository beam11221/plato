[general]
base_path = "./runs/wen_env/S1_wen_fresh_s4126_replay200k"

[clients]
type = "simple"
total_clients = 30
per_round = 3
do_test = false
speed_simulation = true
comm_simulation = true
sleep_simulation = true
avg_training_time = 0.0
max_sleep_time = 300
random_seed = 4126

[clients.simulation_distribution]
# Required by PLATO's client; every duration is overwritten per dispatch by
# the server (wen_server.process_client_info), so these values never reach
# the clock.
distribution = "custom"
csv_path = "/workspace/plato/examples/async/fedasync/gpu_tiers_dataset/fleets/n30_x15-o10-t5_phys_p1667_j0p149_s4126/sleep_times.csv"

[server]
address = "127.0.0.1"
port = 20720
synchronous = false
simulate_wall_time = true
periodic_interval = 1
ping_interval = 30
ping_timeout = 3600
staleness_bound = 19
minimum_clients_aggregated = 1
mixing_hyperparameter = 0.5
adaptive_mixing = true
eval_interval = 10
random_seed = 4126
polaris_alpha = 1.0
polaris_initial_gradient_bound = 0.5
polaris_initial_staleness = 0.01

[server.staleness_weighting_function]
type = "polynomial"
a = 0.5

[wen_env]
scenario = "S1"
arm = "wen_fresh"
stage0 = false
selection = "wen"
wen_t_max = 34.334345905647005
wen_e_max = 36.423846640394224
bundle_dir = "/workspace/plato/examples/async/fedasync/sumo_ver2/bundle_wen_closed_v1"
fleet_dir = "/workspace/plato/examples/async/fedasync/gpu_tiers_dataset/fleets/n30_x15-o10-t5_phys_p1667_j0p149_s4126"
