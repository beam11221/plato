[gpu_tier]
t_round_model = "queue"

[data]
datasource = "Torchvision"
dataset_name = "CIFAR10"
download = true
data_path = "/workspace/plato/examples/async/fedasync/data"
partition_size = 1667
sampler = "noniid"
concentration = 0.8
random_seed = 4126

[trainer]
type = "basic"
rounds = 200
max_concurrency = 3
target_accuracy = 0.9
model_name = "resnet_18"
epochs = 1
batch_size = 64
optimizer = "SGD"

[algorithm]
type = "fedavg"

[parameters]

[parameters.model]
num_classes = 10

[parameters.optimizer]
lr = 0.01
momentum = 0.9
weight_decay = 0.0005

[results]
types = "round, elapsed_time, accuracy, train_loss, valid_loss"
record_clients_accuracy = false
